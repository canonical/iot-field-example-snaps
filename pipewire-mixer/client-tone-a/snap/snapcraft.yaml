name: pw-client-tone-a
base: core26
version: '0.1'
summary: Toy audio client A - plays a 440 Hz tone via the PipeWire mixer
description: |
  A minimal client snap that plays a continuous 440 Hz (A4) sine tone to the
  pipewire-mixer server over the audio-playback interface (PulseAudio-compatible
  socket). Run with pw-client-tone-b to hear two independent snaps mixed by
  PipeWire into one output.

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  play:
    command: bin/play-tone
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    plugs: [audio-playback]
    environment:
      TONE_HZ: "440"

plugs:
  audio-playback:
    interface: audio-playback

parts:
  wrappers:
    plugin: dump
    source: src/
    organize:
      bin/*: bin/

  tools:
    plugin: nil
    stage-packages:
      - pulseaudio-utils
      - sox
    stage:
      - -usr/share/doc
      - -usr/share/man
