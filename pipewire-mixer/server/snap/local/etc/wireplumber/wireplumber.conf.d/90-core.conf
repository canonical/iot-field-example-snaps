# WirePlumber override for the main-systemwide profile.
#
# Intentionally almost empty: the `main-systemwide` profile already disables
# the session/desktop pieces we don't want. Add overrides here ONLY if a
# specific component in main-systemwide misbehaves in your setup.
#
# DO NOT re-enable the device reservation (reserve-device / D-Bus
# org.freedesktop.ReserveDevice1) component: there is no session D-Bus in this
# confined system-mode example, so reservation would just fail.
#
# Example (left commented) of how you WOULD override a component if needed:
# wireplumber.profiles = {
#   main-systemwide = {
#     # some.component = disabled
#   }
# }
