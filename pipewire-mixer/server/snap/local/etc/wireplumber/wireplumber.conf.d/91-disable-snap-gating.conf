# Disable WirePlumber's snapd audio permission gating in this confined
# system-mode daemon.
#
# WirePlumber's `script.client.access-snap` (access-snap.lua) REVOKES sink/source
# access from any client that lacks the `pipewire.snap.audio.playback` property.
# That property is only set by `support.snapd-permission-prompting`, which asks
# snapd whether the client's snap may play audio. This daemon cannot reach snapd
# (no session/system D-Bus in the confined system service), so the prompting
# module fails closed, the property is never set, and access-snap.lua strips the
# hardware sink from every client -> streams never link -> no audio.
#
# Access to the audio sockets is already controlled by the snapd audio-playback
# interface, so this extra WirePlumber-level snap gating is redundant here.
# Disable both components; combined with client.access=unrestricted on the pulse
# socket, clients then get normal access to the sink.
wireplumber.profiles = {
  main-systemwide = {
    support.snapd-permission-prompting = disabled
    script.client.access-snap = disabled
  }
}
