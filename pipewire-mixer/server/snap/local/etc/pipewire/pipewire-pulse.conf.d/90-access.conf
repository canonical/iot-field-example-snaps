# Grant PulseAudio-compatibility clients full (rwx) PipeWire permissions.
#
# Cross-snap clients connect to our pulse socket ($SNAP_COMMON/pulse/native).
# By default module-access flags them as sandboxed and gives them only r+m
# permissions (no "x"), so their streams cannot LINK to our sink
# ("pw.link: link not allowed"). Access to this socket is already gated by the
# snapd audio-playback interface (only connected snaps can reach the socket),
# so it is safe to mark these clients unrestricted here.
pulse.properties = {
    server.address = [
        { address = "unix:native"
          client.access = "unrestricted"
        }
    ]
}
