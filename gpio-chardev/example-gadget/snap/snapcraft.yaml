name: gpio-chardev-example-gadget
version: '26-0.1'
type: gadget
base: core26
summary: Example pc gadget with a gpio-chardev slot
description: |
  The official Ubuntu Core 26 "pc" gadget (amd64) with an added gpio-chardev
  slot named "example-gpio", so the gpio-chardev-consumer snap can connect.

  This mirrors snapcore/pc-gadget (branch 26) part-for-part and only adds a
  step that appends the gpio-chardev slot to the produced gadget.yaml. For a
  different board, do the same to that board's gadget: append the slots: block
  (see slots.yaml) to its gadget.yaml.

grade: stable
confinement: strict

# shim 15.7 support (from upstream pc gadget)
assumes:
  - snapd2.72

platforms:
  amd64:

parts:
  mbr:
    source: https://github.com/snapcore/pc-gadget.git
    source-branch: "26"
    source-subdir: legacy-bios
    plugin: make
    override-build: |
      if [ "${CRAFT_ARCH_BUILD_FOR}" != amd64 ]; then
          exit
      fi
      craftctl default

  boot-assets:
    plugin: nil
    build-packages:
      - sbsigntool
    stage-packages:
      - grub-efi-$CRAFT_ARCH_BUILD_FOR-signed
      - shim-signed
    override-build: |
      set -x
      grub_target=x86_64
      grub_bin=grubx64.efi.signed
      shim_bin=shimx64.efi.dualsigned
      fb_bin=fbx64.efi
      boot_csv=BOOTX64.CSV

      shim_path="${CRAFT_PART_INSTALL}"/usr/lib/shim/$shim_bin
      fb_path="${CRAFT_PART_INSTALL}/usr/lib/shim/${fb_bin}"
      bootcsv_path="${CRAFT_PART_INSTALL}/usr/lib/shim/${boot_csv}"
      grub_path="${CRAFT_PART_INSTALL}"/usr/lib/grub/"$grub_target"-efi-signed/$grub_bin
      sbverify --list "$shim_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'
      sbverify --list "$grub_path" | grep -E 'Canonical Ltd. Secure Boot Signing \(2022 v1\)'

      install -m 644 "$shim_path" "${CRAFT_PART_INSTALL}"/shim.efi.signed
      install -m 644 "$grub_path" "${CRAFT_PART_INSTALL}"/${grub_bin%.signed}
      install -m 644 "${fb_path}" "${CRAFT_PART_INSTALL}/fb.efi"
      install -m 644 "${bootcsv_path}" "${CRAFT_PART_INSTALL}/boot.csv"

      find "${CRAFT_PART_INSTALL}"/ -type f,l \
                -not -path "${CRAFT_PART_INSTALL}"/shim.efi.signed \
                -not -path "${CRAFT_PART_INSTALL}"/${grub_bin%.signed} \
                -not -path "${CRAFT_PART_INSTALL}"/fb.efi \
                -not -path "${CRAFT_PART_INSTALL}"/boot.csv \
                -not -path "${CRAFT_PART_INSTALL}"/usr/share/doc/grub-efi-${CRAFT_ARCH_BUILD_FOR}-signed/'*' \
           -and -not -path "${CRAFT_PART_INSTALL}"/'usr/share/doc/shim-signed/*' \
           -delete
      find "${CRAFT_PART_INSTALL}"/ -type d -empty -delete
      install -m 644 /dev/null "${CRAFT_PART_INSTALL}"/grub.conf

  gadget:
    after: [mbr, boot-assets]
    plugin: nil
    source: https://github.com/snapcore/pc-gadget.git
    source-branch: "26"
    source-subdir: gadget
    override-build: |
      # Start from the upstream arch-specific gadget.yaml, then append our
      # gpio-chardev slot from slots.yaml (kept in this project's snap/ dir).
      base_yaml="gadget/gadget-${CRAFT_ARCH_BUILD_FOR}.yaml"
      out="${CRAFT_PROJECT_DIR}/gadget.yaml"
      cat "${base_yaml}" "${CRAFT_PROJECT_DIR}/snap/slots.yaml" > "${out}"
      # snapcraft picks up gadget.yaml from the project dir for a gadget snap.
